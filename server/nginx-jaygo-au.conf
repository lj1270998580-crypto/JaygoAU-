# Jaygo AU 后端（转录 OSS 预签名 + 更新文件托管）
# 用法：在 ailabing.cn 的 server 块内 `include /www/wwwroot/ailabing.cn/jaygo-au/nginx-jaygo-au.conf;`
#       或复制到 /etc/nginx/conf.d/jaygo-au.conf 后 `nginx -t && systemctl reload nginx`
# 前置：后端已用 `pm2 start /www/wwwroot/ailabing.cn/jaygo-au/server/jaygo-au-backend.mjs` 启动（默认 8787 端口）

# 后端 API（转录预签名令牌 / 删除 / 健康检查）
location /api/jaygo-au/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 更新文件静态托管（electron-updater 依赖 Range 请求做差量更新）
location /jaygo-au/updates/ {
    alias /www/wwwroot/ailabing.cn/jaygo-au/updates/;
    add_header Access-Control-Allow-Origin *;
    types { .blockmap application/octet-stream; }
    accept_ranges on;
    autoindex off;
}
