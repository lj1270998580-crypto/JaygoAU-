# Jaygo AU 后端（转录本地临时存储 + 更新文件托管）
# 放置到：/www/server/panel/vhost/nginx/extension/ailabing.cn/jaygo-au.conf
#        该目录已被 html_ailabing.cn.conf 通过 include *.conf 自动引入，无需改主配置。
# 前置：后端已用 pm2 启动（默认 8787 端口）
#        pm2 start /www/wwwroot/ailabing.cn/jaygo-au/server/jaygo-au-backend.mjs
#
# 说明：/jaygo-au/updates/ 的静态托管由站点 root 直接提供（已验证支持 Range/206），
#        这里只需把 /api/jaygo-au/ 反代到后端进程。

# 后端 API（转录票据 / 上传 / 下载 / 删除 / 健康检查）
# 注意：proxy_pass 末尾「不要」带斜杠，否则会把 /api/jaygo-au/ 前缀一起去掉，
#       导致后端收到的路径变成 /oss-token 而路由失败。
location /api/jaygo-au/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 200m;          # 允许上传较大音频
    proxy_request_buffering off;        # 流式转发 PUT 上传体
}
